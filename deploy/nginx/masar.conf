# MASAR — nginx site config.
#
# Validate with `nginx -t` before every reload. deploy.sh does this, and refuses
# to reload on a bad config: an invalid config that reloads takes the site down,
# one that fails validation takes nothing down.

server {
    listen 80;
    listen [::]:80;
    server_name _;                       # replaced at domain cutover

    root /var/www/masar/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;            # video renditions are up to 10M, plus slack

    # ---- compression ------------------------------------------------------
    # CLAUDE.md §9 records this as worth ~1.9s of LCP and as a deployment
    # requirement, not something to paper over with Laravel middleware.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff2;
    # woff2 is already compressed; it is listed because the fonts are subset and
    # gzip still shaves a little. Remove if it ever measures worse.

    # ---- security headers -------------------------------------------------
    # Included here AND in every location below that sets a header of its own —
    # see the comment in the file for why nginx makes that necessary.
    include /etc/nginx/snippets/masar-security-headers.conf;

    # ---- static assets ----------------------------------------------------
    # The build is content-hashed, so it may be cached hard and forever.
    location ^~ /build/ {
        access_log off;
        expires 1y;
        include /etc/nginx/snippets/masar-security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf|otf)$ {
        access_log off;
        expires 1y;
        include /etc/nginx/snippets/masar-security-headers.conf;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|mp4|webm)$ {
        access_log off;
        expires 30d;
        include /etc/nginx/snippets/masar-security-headers.conf;
        add_header Cache-Control "public";
    }

    # ---- routing ----------------------------------------------------------
    # NOTE: robots.txt and the sitemaps are ROUTES, not files. They are served
    # by index.php below because no file of that name exists in public/ — and a
    # static public/robots.txt once shadowed the route silently for the life of
    # the project. `masar:smoke` asserts the file is absent; do not add one.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/masar.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include fastcgi_params;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Nothing under a dot is ever served — .env above all.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/masar.access.log;
    error_log  /var/log/nginx/masar.error.log;
}
