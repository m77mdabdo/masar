; MASAR — Horizon under Supervisor.
;
; Horizon is a supervised process, not a terminal someone left open. 1,771 jobs
; once queued with no worker running and nobody noticed; `masar:smoke` now fails
; a deploy if no worker is up.

[program:masar-horizon]
process_name=%(program_name)s
command=/usr/bin/php /var/www/masar/artisan horizon
directory=/var/www/masar
user=masar
autostart=true
autorestart=true
; Horizon is told to finish its current job and exit on deploy
; (`artisan horizon:terminate`); that is an expected exit, not a crash.
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/masar-horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:masar-scheduler]
process_name=%(program_name)s
; The scheduler, not a crontab: one supervised process, logged in the same place
; as everything else. `schedule:work` ticks every minute internally.
command=/usr/bin/php /var/www/masar/artisan schedule:work
directory=/var/www/masar
user=masar
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/masar-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
