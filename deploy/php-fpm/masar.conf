; MASAR — PHP-FPM pool.
; Drop at /etc/php/8.4/fpm/pool.d/masar.conf and remove the default www pool.

[masar]
user  = masar
group = masar

listen       = /run/php/masar.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Sized for 8 GB with MySQL, Redis and Horizon on the same box. Each child peaks
; around 80-120 MB during a GD image conversion, so 20 children is ~2.4 GB worst
; case and leaves room for everything else.
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; Long enough for a media conversion, short enough that a wedged request does
; not hold a child forever.
request_terminate_timeout = 60s
php_admin_value[memory_limit] = 256M

; 64M covers a 2400px master upload with headroom; nginx allows 64M to match.
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size]       = 64M

php_admin_value[error_log] = /var/log/php/masar-fpm.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; OPcache. `validate_timestamps=0` means a deploy MUST reload php-fpm or the old
; code keeps running — deploy.sh reloads, and the smoke check would catch it.
php_admin_value[opcache.enable]              = 1
php_admin_value[opcache.memory_consumption]  = 192
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.interned_strings_buffer] = 16

php_admin_value[date.timezone] = Asia/Riyadh
php_admin_value[expose_php]    = Off
