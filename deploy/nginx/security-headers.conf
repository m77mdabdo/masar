# Security headers, in one file because nginx makes this a trap.
#
# `add_header` is NOT additive across levels: a location block that sets any
# add_header of its own DISCARDS every add_header inherited from the server
# block. Three location blocks in masar.conf set Cache-Control, and each one of
# them silently dropped all four security headers — for the build assets, the
# fonts, and every image and video, which is exactly where `nosniff` earns its
# keep: an uploaded file sniffed as HTML is stored XSS on our own origin.
#
# So this file is included at the server level AND inside every location that
# sets a header of its own. One implementation, repeated by include rather than
# by copy (CLAUDE.md §6).

add_header X-Content-Type-Options   "nosniff"                         always;
add_header X-Frame-Options          "SAMEORIGIN"                      always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

# Explicitly 0, not 1. The legacy XSS auditor introduced vulnerabilities of its
# own and is removed from every current browser; 0 disables it where it lingers.
add_header X-XSS-Protection         "0"                               always;

# We ask for no device permission anywhere on the site, so deny all three
# outright rather than leaving the default open to a future embed.
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# HSTS: uncomment at the domain cutover, once TLS is serving and verified.
# Do not enable it before that — a browser that caches this against a host with
# no working certificate has locked itself out for max-age seconds.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
